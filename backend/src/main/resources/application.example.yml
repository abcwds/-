server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pet_adoption?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: change-me
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: replace-with-a-long-random-secret
  expiration: 86400000

deepseek:
  base-url: https://api.deepseek.com
  model: deepseek-chat
  api-key: ${DEEPSEEK_API_KEY:}

logging:
  level:
    com.pet: info
